[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fate-py"
version = "0.2.1"
description = "Four Pillars of Destiny (BaZi / 사주팔자) engine — pure numpy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
build = ["lunar_python"]
dev   = ["lunar_python", "pytest"]

[project.urls]
Repository = "https://github.com/greyfolk99/fate-py"

[tool.hatch.build.targets.wheel]
packages = ["bazi"]
include = [
    "bazi/_data/jieqi_*.npz",
    "bazi/_data/lunar_*.npz",
]
exclude = [
    "bazi/_data/ground_truth_*",
    "tests/",
    "scripts/",
]
