[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-bazi"
version = "0.1.0"
description = "Four Pillars of Destiny (BaZi / 사주팔자) engine — pure numpy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
build = ["lunar_python"]
dev   = ["lunar_python", "pytest"]

[project.urls]
Repository = "https://github.com/greyfolk99/python-bazi"

[tool.hatch.build.targets.wheel]
packages = ["bazi"]
include = ["bazi/_data/*.npz"]
